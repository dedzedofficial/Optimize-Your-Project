name: Check release packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Blender version
        id: versions
        run: echo "blender=$(python3 -c 'import json; print(json.load(open(\"version.json\"))[\"blender\"])')" >> "$GITHUB_OUTPUT"
      - name: Validate versions, logos and packages
        run: python3 scripts/check_release.py
      - name: Build Blender extension ZIP
        run: python3 scripts/build_blender_extension.py
      - name: Upload Blender ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: optimize-your-project-blender-${{ steps.versions.outputs.blender }}
          path: |
            dist/optimize-your-project-blender-extension-${{ steps.versions.outputs.blender }}.zip
            dist/optimize-your-project-blender-${{ steps.versions.outputs.blender }}.zip
          if-no-files-found: error
          retention-days: 90
  blender-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender:
          - { series: '3.6', version: '3.6.23' }
          - { series: '4.2', version: '4.2.9' }
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Download Blender
        env:
          BLENDER_SERIES: ${{ matrix.blender.series }}
          BLENDER_VERSION: ${{ matrix.blender.version }}
        run: |
          curl --fail --location --retry 3 "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: Test remesh triangle budgets and LOD workflows
        run: '"$RUNNER_TEMP/blender/blender" --background --factory-startup --python-exit-code 1 --python scripts/test_blender.py'
      - name: Validate Blender extension package
        if: matrix.blender.series == '4.2'
        run: |
          python3 scripts/build_blender_extension.py
          BLENDER_PACKAGE="dist/optimize-your-project-blender-extension-$(python3 -c 'import json; print(json.load(open(\"version.json\"))[\"blender\"])').zip"
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --command extension validate "$BLENDER_PACKAGE"
