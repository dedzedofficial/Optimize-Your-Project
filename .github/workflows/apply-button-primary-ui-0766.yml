name: Apply button-first UI v0.7.66

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_button_ui_0766.py'
      - '.github/workflows/apply-button-primary-ui-0766.yml'

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI patch
        run: python scripts/apply_button_ui_0766.py
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore button-first platform UI for v0.7.66"
          git push origin main
