name: Apply button-first UI v0.7.66

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-button-primary-ui-0766.yml'

permissions:
  contents: write

jobs:
  apply-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply button-first UI and version update
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          # Unity: remove Quick Optimize/configuration-first presentation and restore
          # the feature buttons themselves as the primary interface.
          path = root / 'Editor/FISHHWBVR/FISHHWBVROptimizerWindow.cs'
          text = path.read_text(encoding='utf-8')
          text = text.replace('window.minSize = new Vector2(560, 620);', 'window.minSize = new Vector2(500, 570);')
          pattern = re.compile(r'''        void DrawOptimizeArea\(GameObject root, string folder, bool valid, bool avatarScope\)\n        \{.*?\n        void DrawProjectReview\(bool valid\)''', re.S)
          replacement = '''        void DrawOptimizeArea(GameObject root, string folder, bool valid, bool avatarScope)
        {
            DrawSectionLabel(T("one_click"));
            EditorGUILayout.BeginVertical(panelStyle);

            using (new EditorGUI.DisabledScope(!valid))
            {
                EditorGUILayout.BeginHorizontal();
                if (Primary(T("optimize_textures"))) OptimizeTextures(root, folder);
                if (Primary(T("optimize_models"))) OptimizeModelImports(root);
                EditorGUILayout.EndHorizontal();

                EditorGUILayout.BeginHorizontal();
                if (Primary(T("optimize_particles"))) OptimizeParticles(root);
                if (Primary(T("fix_materials"))) FixExpensiveMaterialSetups(root, folder);
                EditorGUILayout.EndHorizontal();

                EditorGUILayout.BeginHorizontal();
                if (avatarScope)
                {
                    if (Primary(T("disable_shadows"))) DisableRealtimeShadows(root);
                }
                else
                {
                    using (new EditorGUI.DisabledScope(EditorApplication.isPlayingOrWillChangePlaymode || Lightmapping.isRunning))
                        if (Primary(T("optimize_lighting"))) summary = VRLightingSetup.Optimize();
                }

                if (Primary(T("optimize_ui_raycasts"))) summary = VRUIRaycastOptimizer.Optimize(root);
                EditorGUILayout.EndHorizontal();

                if (Primary(T("clean_missing_scripts"))) summary = VRMissingScriptCleaner.Clean(root);
            }

            DrawAdvancedSettings();
            EditorGUILayout.EndVertical();
        }

        void DrawProjectReview(bool valid)'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace Unity optimize area')
          path.write_text(text, encoding='utf-8')

          # Blender: make actual operations the primary panel instead of a Quick Optimize wrapper.
          path = root / '__init__.py'
          text = path.read_text(encoding='utf-8')
          text = text.replace('"version": (0, 7, 65)', '"version": (0, 7, 66)')
          text = text.replace('"EN": "Blender v0.7.65: Quick Optimize"', '"EN": "Blender v0.7.66: Primary Actions"')
          text = text.replace('"JA": "Blender v0.7.65: クイック最適化"', '"JA": "Blender v0.7.66: 主要アクション"')
          text = text.replace('"ZH": "Blender v0.7.65：快速优化"', '"ZH": "Blender v0.7.66：主要操作"')
          text = text.replace('"KO": "Blender v0.7.65: 빠른 최적화"', '"KO": "Blender v0.7.66: 주요 작업"')
          draw_pattern = re.compile(r'''def _draw_core_765\(self, context\):\n.*?\n\n# Replace the older stacked panel''', re.S)
          draw_replacement = '''def _draw_core_765(self, context):
    layout = self.layout
    layout.use_property_split = False
    layout.use_property_decorate = False

    brand = layout.box()
    if _addon._brand_preview and "logo" in _addon._brand_preview:
        brand.template_icon(icon_value=_addon._brand_preview["logo"].icon_id, scale=2.2)
    brand.label(text=_addon.tr(context, "title"))
    brand.label(text=_addon.tr(context, "subtitle"))
    brand.prop(context.scene, "fishhwb_language", text=_addon.tr(context, "language"))

    obj = context.active_object
    selected_meshes = [item for item in context.selected_objects if item.type == "MESH"]

    selected = layout.box()
    selected.label(text=_addon.tr(context, "selection"), icon="MESH_DATA")
    if obj and obj.type == "MESH":
        selected.label(text=obj.name)
        stats = selected.row(align=True)
        stats.label(text=f"Triangles: {_addon.triangle_count(obj.data):,}")
        stats.label(text=f"Vertices: {len(obj.data.vertices):,}")
        selected.prop(obj, "fishhwb_protect_detail", text=_addon.tr(context, "protect_detail"))
        if obj.get("fishhwb_remesh_history") or obj.get("fishhwb_lod_history"):
            selected.operator("fishhwb.reset_optimization_history", text=_addon.tr(context, "reset_history"), icon="FILE_REFRESH")
        if len(selected_meshes) > 1:
            selected.label(text=f"{len(selected_meshes)} mesh objects selected")
    else:
        _wrapped(selected, _addon.tr(context, "select_mesh"), context, "INFO")

    primary = layout.box()
    primary.label(text="PRIMARY ACTIONS", icon="TOOL_SETTINGS")

    remesh = primary.box()
    remesh.prop(context.scene, "fishhwb_triangle_target", text=_addon.tr(context, "triangle_target"), slider=True)
    row = remesh.row()
    row.scale_y = 1.5
    row.operator("fishhwb.one_click_remesh", text="REMESH TO TRIANGLE TARGET", icon="MOD_REMESH")

    lod = primary.box()
    lod.prop(context.scene, "fishhwb_apply_modifiers", text=_addon.tr(context, "apply_modifiers"))
    lod.prop(context.scene, "fishhwb_create_collision_proxy", text=_addon.tr(context, "collision_proxy"))
    row = lod.row()
    row.scale_y = 1.5
    row.operator(
        "fishhwb.create_lods_selected" if len(selected_meshes) > 1 else "fishhwb.create_lods",
        text="CREATE LOD0 / LOD1 / LOD2", icon="MOD_DECIM",
    )

    row = primary.row()
    row.scale_y = 1.4
    row.operator("fishhwb.generate_lightmap_uv", text="GENERATE LIGHTMAP UV", icon="UV")

    row = primary.row()
    row.scale_y = 1.4
    row.operator("fishhwb.link_identical_mesh_data", text="LINK IDENTICAL MESH DATA", icon="LINKED")

    row = primary.row()
    row.scale_y = 1.4
    row.operator("fishhwb.strip_collider_render_data", text="STRIP COLLIDER RENDER DATA", icon="TRASH")

    if context.scene.fishhwb_last_result:
        result = layout.box()
        result.label(text=_addon.tr(context, "last_result"), icon="INFO")
        for line in context.scene.fishhwb_last_result.splitlines():
            _wrapped(result, line, context)


# Replace the older stacked panel'''
          text, count = draw_pattern.subn(draw_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace Blender panel')
          path.write_text(text, encoding='utf-8')

          # Unified version bump. v0.7.65 is already a published immutable tag.
          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.7.66'
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          version_path = root / 'version.json'
          versions = json.loads(version_path.read_text(encoding='utf-8'))
          versions.update({
              'version': '0.7.66',
              'unity': '0.7.66',
              'unity_tag': 'v0.7.66',
              'unity_url': 'https://github.com/dedzedofficial/Optimize-Your-Project/releases/tag/v0.7.66',
              'blender': '0.7.66',
              'blender_tag': 'v0.7.66',
          })
          version_path.write_text(json.dumps(versions, indent=2) + '\n', encoding='utf-8')

          manifest = root / 'blender_manifest.toml'
          m = manifest.read_text(encoding='utf-8').replace('version = "0.7.65"', 'version = "0.7.66"')
          manifest.write_text(m, encoding='utf-8')

          updater = root / 'Editor/FISHHWBVR/VRUpdateChecker.cs'
          u = updater.read_text(encoding='utf-8').replace('return info != null ? info.version : "0.7.65";', 'return info != null ? info.version : "0.7.66";')
          updater.write_text(u, encoding='utf-8')

          # Docs and validation.
          for rel in ['README.md', 'Blender/README.md', 'Documentation/Architecture.md']:
              p = root / rel
              s = p.read_text(encoding='utf-8').replace('0.7.65', '0.7.66').replace('Quick Optimize', 'Primary Actions')
              p.write_text(s, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          c = changelog.read_text(encoding='utf-8')
          marker = '## 0.7.65\n'
          section = '''## 0.7.66\n\n### UI correction\n\n- Restored a button-first Unity layout where each optimization feature is a primary action instead of leading with bundled configurations.\n- Kept Advanced settings and all 0.7.65 safety improvements behind the same feature buttons.\n- Kept permanent unused-asset deletion isolated in the Unity danger zone.\n- Changed Blender to a single Primary Actions panel with direct Remesh, LOD, Lightmap UV, identical-mesh linking and collider-cleanup buttons.\n- Reduced explanatory UI clutter while keeping operator tooltips, confirmations and result summaries.\n\n'''
          if marker not in c:
              raise SystemExit('Could not find changelog insertion point')
          c = c.replace(marker, section + marker, 1)
          changelog.write_text(c, encoding='utf-8')

          roadmap = root / 'Documentation/Roadmap.md'
          r = roadmap.read_text(encoding='utf-8')
          r = r.replace('Current baseline: v0.7.65', 'Current baseline: v0.7.66')
          r = r.replace('## v0.7.66 - Current integration refinement', '## v0.7.67 - Current integration refinement')
          roadmap.write_text(r, encoding='utf-8')

          test = root / 'scripts/test_blender_42.py'
          t = test.read_text(encoding='utf-8').replace('(0, 7, 65)', '(0, 7, 66)').replace('0.7.65', '0.7.66')
          test.write_text(t, encoding='utf-8')

          check = root / 'scripts/check_release.py'
          s = check.read_text(encoding='utf-8')
          s = s.replace('0.7.65', '0.7.66')
          s = s.replace('"window.minSize = new Vector2(560, 620)",\n    "DrawOptimizeArea",\n    "RunQuickOptimize",\n    \'ApplyConfiguration("Balanced")\',\n    \'ApplyConfiguration("Mobile")\',\n    \'ApplyConfiguration("VR")\',', '"window.minSize = new Vector2(500, 570)",\n    "DrawOptimizeArea",\n    \'T("one_click")\',')
          s = s.replace("    '_draw_core_765',\n    'quick.label(text=\"QUICK OPTIMIZE\"',", "    '_draw_core_765',\n    'primary.label(text=\"PRIMARY ACTIONS\"',")
          s = s.replace('assert extension_archive.name == "optimize-your-project-blender-extension-0.7.66.zip"', 'assert extension_archive.name == "optimize-your-project-blender-extension-0.7.66.zip"')
          check.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Editor/FISHHWBVR/FISHHWBVROptimizerWindow.cs Editor/FISHHWBVR/VRUpdateChecker.cs __init__.py package.json version.json blender_manifest.toml README.md Blender/README.md Documentation/Architecture.md Documentation/Roadmap.md CHANGELOG.md scripts/test_blender_42.py scripts/check_release.py
          git commit -m "Restore button-first platform UI for v0.7.66"
          git push origin main
