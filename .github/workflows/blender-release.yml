name: Publish Blender add-on
on:
  push:
    tags:
      - 'blender-v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check Blender add-on
        run: python3 scripts/build_blender.py
      - name: Publish Blender archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/optimize-your-project-blender-*.zip --generate-notes
