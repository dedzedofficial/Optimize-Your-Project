name: Publish v0.7.61 tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.7.61-tag.yml'

permissions:
  contents: write

jobs:
  publish-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v0.7.61 tag on validated release commit
        env:
          RELEASE_SHA: 58aff14a8fb37bd8e47df07959299add7e768c0d
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.7.61 >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 v0.7.61)"
            if [ "$EXISTING_SHA" != "$RELEASE_SHA" ]; then
              echo "v0.7.61 already exists at $EXISTING_SHA, expected $RELEASE_SHA"
              exit 1
            fi
            echo "v0.7.61 already points to the requested release commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.61 "$RELEASE_SHA" -m "Optimize Your Project v0.7.61"
          git push origin refs/tags/v0.7.61
